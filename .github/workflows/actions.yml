on: 
  workflow_dispatch:

jobs:
  hybrid_jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Run a cmd in Ubuntu VM
        run: echo "This step runs on Ubuntu VM"

      - name: Run a cmd inside an Alpine container
        uses: docker://alpine:3.24
        with:
          entrypoint: /bin/sh
          args: -c "echo 'This step runs inside docker Alpine container'"
        
      - name: Run another cmd in ubuntu VM
        run: echo "Back to VM"

  dockerized_job:
    runs-on: ubuntu-latest
    container: node:20
        # image : ghcr.io/org/private-image:tag
        # credencials:
        #      username: ${{secrets.DOCKER_USERNAME}}
        #      password: ${{secrets.DOCKER_PASSWORD}}
    steps:
      - run: node --version
      - run: echo "This whole job runs inside a Node.js container"
    
