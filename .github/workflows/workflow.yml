name: Test_Pipeline
on:
  push:
    branches: [main]

jobs:
 build:
   runs-on: ubunto-latest


   steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: Set up node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install dependencies
        uses: npm install

      - name: Run tests
        run: npm test
